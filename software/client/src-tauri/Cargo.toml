[package]
name = "attinav-client"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/neolut/attinav"
authors = ["Angelo Delefortrie <angelo@neolut.com>"]
description = "Desktop client for the Attinav survey module: test, calibrate, visualise, configure, update"
publish = false

[lib]
name = "attinav_client"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The protocol codec, calibration model and solver are the firmware's own crate.
attinav-core = { path = "../../firmware/attinav-core", features = ["std", "serde"] }

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serialport = { version = "4.7", default-features = false }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crc32fast = "1"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "thread_rng"] }

[features]
# Tauri's custom-protocol feature is required for the production bundle.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# Tauri command handlers are `async fn` taking `State<'_, _>`; the generated glue is not `Send`-clean.
future_not_send = "allow"
# Tauri's `generate_handler!` expands to a function with many branches.
too_many_lines = "allow"
# Numerical code in the simulator: f64 <-> f32 conversions are deliberate.
cast_lossless = "allow"
float_cmp = "allow"
suboptimal_flops = "allow"
similar_names = "allow"
many_single_char_names = "allow"
# Index-coupled loops over sensor arrays read better with explicit indices.
needless_range_loop = "allow"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = "symbols"
