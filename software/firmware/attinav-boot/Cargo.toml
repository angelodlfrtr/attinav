[package]
name = "attinav-boot"
description = "embassy-boot bootloader for the Attinav Rev B board: swaps in firmware images staged by the application over USB / the carrier UART, with rollback"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
embassy-stm32 = { version = "0.6.0", features = ["stm32u575rg", "dual-bank", "unstable-pac"] }
embassy-boot-stm32 = { version = "0.8.0" }
embassy-sync = { version = "0.8.0" }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
defmt = { workspace = true, optional = true }
defmt-rtt = { workspace = true, optional = true }

[features]
default = []
# RTT logging of the bootloader decisions (costs a few KB; the partition has room).
defmt = ["dep:defmt", "dep:defmt-rtt", "embassy-boot-stm32/defmt", "embassy-stm32/defmt"]

[lints]
workspace = true
